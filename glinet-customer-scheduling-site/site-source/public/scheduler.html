<!doctype html>

<style>
:root{
  --bg:#f3fbf5;--panel:#ffffff;--ink:#143126;--muted:#5e7d6f;--line:#cfe6d7;
  --blue:#22a05a;--red:#b42318;--amber:#b54708;--green:#087443;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f7fdf8 0%,#edf7ef 100%);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
main{max-width:1500px;margin:0 auto;padding:22px}
h1,h2,h3,p{margin:0}
h1{font-size:28px;margin-bottom:6px;color:#103625}
h2{font-size:18px;margin-bottom:10px}
.small{color:var(--muted);font-size:13px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 14px 40px rgba(27,94,48,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{display:block;color:var(--muted);font-size:13px;margin:8px 0}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
#month{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
#month::-webkit-datetime-edit,
#month::-webkit-datetime-edit-fields-wrapper,
#month::-webkit-datetime-edit-text,
#month::-webkit-datetime-edit-month-field,
#month::-webkit-datetime-edit-year-field{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
textarea{min-height:120px;font:13px/1.5 Consolas,"Microsoft YaHei",monospace;resize:vertical}
button{height:38px;border:1px solid var(--blue);background:linear-gradient(135deg,#33bf72,#229f5a);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer;margin:4px 8px 4px 0;box-shadow:0 10px 24px rgba(34,160,90,.16)}
button.secondary{background:#fff;color:var(--blue);box-shadow:none}
.scroll{overflow-x:auto;overflow-y:visible}
.monthlyScroll{max-height:72vh;overflow:auto}
.monthlyScroll #monthly{min-width:max-content}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 8px;font-size:13px;text-align:center;white-space:nowrap}
th{background:#edf8f0}
.groupTitle td{background:#ddf3e3!important;font-weight:800;text-align:left;border-top:3px solid #1f6d44}
.warn{color:var(--amber);font-weight:700}
.bad{color:var(--red);font-weight:800}
.ok{color:var(--green);font-weight:800}
.restCell{background:#fff!important;color:#98a2b3}
.blankCell{background:#f3faf5!important;color:#b9cebf}
.prevMonthCell{background:#f3faf5!important;color:var(--muted)}
.prevMonthHead{background:#f3faf5!important;color:var(--muted)}
.prevMonthEditable{cursor:text}
.leaveCell,.leaveCell .scheduleSelect{color:var(--red)!important}
.scheduleSelect{min-width:74px;border:0;background:transparent;padding:2px 4px;font:inherit;font-weight:700;text-align:center;color:inherit}
.scheduleSelect:focus{outline:2px solid rgba(34,160,90,.28);background:#fff;border-radius:4px}
.scheduleCellWrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.tagSelect{min-width:74px;border:1px dashed rgba(34,160,90,.24);background:rgba(255,255,255,.72);padding:1px 4px;font-size:11px;line-height:1.35;text-align:center;color:var(--muted);border-radius:6px}
.tagSelect:disabled{opacity:.55;background:rgba(243,250,245,.9);color:#97aa9f}
.tagSelect[data-has-tag="1"]{color:transparent}
.tagSelect option{color:var(--ink)}
.tagSelect:focus{outline:2px solid rgba(34,160,90,.2);background:#fff;border-radius:4px}
.tagBadge{font-size:14px;line-height:1.1;color:#111;font-weight:800;font-family:"SimHei","Microsoft YaHei","PingFang SC",sans-serif;background:none;border:0;padding:0;cursor:pointer}
.planToolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.planToolbar label{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.planToolbar select{min-width:112px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.planStack{display:flex;flex-direction:column;gap:18px}
.planPanel{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.planPanel.planBPanel{background:#f4f5f7}
.planPanel.planCPanel{background:#f8f8fb}
.planPanelHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.planPanelHeader h3{font-size:18px}
.planPanelHint{font-size:12px;color:var(--muted)}
.planEmpty{padding:18px 12px;border:1px dashed var(--line);border-radius:12px;background:#fbfdfb;color:var(--muted);text-align:center}
.manualCellSelected{outline:2px solid rgba(34,160,90,.55);outline-offset:-2px;position:relative;z-index:1}
.compareDiffCell{box-shadow:inset 0 0 0 2px rgba(34,160,90,.45)}
.summaryRow td{background:#f3faf5!important;font-weight:800}
.monthlyTable .stickySecond{position:sticky;left:0;z-index:3;background:#fff;box-shadow:2px 0 0 var(--line)}
.monthlyTable .stickyThird{position:sticky;left:88px;z-index:3;background:#fff;box-shadow:2px 0 0 var(--line)}
.monthlyTable th.stickySecond,.monthlyTable th.stickyThird{background:#edf8f0;z-index:5}
.monthlyTable thead th{position:sticky;top:0;z-index:7;background:#edf8f0;box-shadow:0 2px 0 var(--line)}
.monthlyTable thead th.stickySecond,.monthlyTable thead th.stickyThird,.monthlyTable thead th.stickyCount{z-index:9}
.monthlyTable thead th.holidayHead{background:#f5c542;color:#4a3200}
.monthlyTable .summaryStickyLabel{position:sticky;left:0;z-index:4;background:#f3faf5!important;box-shadow:2px 0 0 var(--line);text-align:left}
.monthlyTable .stickyCount{position:sticky;z-index:4;background:#fff;min-width:88px}
.monthlyTable .stickyWork{right:88px;box-shadow:-2px 0 0 var(--line)}
.monthlyTable .stickyRest{right:0}
.monthlyTable th.stickyCount{background:#edf8f0;z-index:6}
.summaryRow .stickyCount{background:#f3faf5!important}
.keyDayCell,.keyDayCell .scheduleSelect{font-weight:800}
.draggablePersonRow{cursor:grab}
.draggablePersonRow:active{cursor:grabbing}
.draggablePersonRow.dragOver td{box-shadow:inset 0 2px 0 var(--blue)}
.dragHandle{cursor:grab}
.dragOver{outline:2px solid var(--blue);outline-offset:-2px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-size:13px}
.holidayPicker{display:flex;flex-direction:column;gap:10px}
.holidaySummary{min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;font-size:13px;line-height:1.5;color:var(--ink)}
.holidayCalendar{border:1px solid var(--line);border-radius:8px;padding:12px;background:#f3faf5}
.holidayWeekdays,.holidayGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.holidayWeekdays span{font-size:12px;color:var(--muted);text-align:center}
.holidayDay{min-height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;cursor:pointer;margin:0;padding:0;width:100%;height:auto;box-shadow:none}
.holidayDay.muted{background:#eef5f0;color:#98a2b3;cursor:default}
.holidayDay.active{background:#22a05a;color:#fff;border-color:#22a05a;font-weight:700}
.holidayActions{display:flex;gap:8px;margin-top:10px}
.holidayActions button{margin:0}
.blockedDatePicker{display:flex;flex-direction:column;gap:8px}
.blockedDateSummary{min-height:30px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;font-size:12px;line-height:1.35;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.blockedDateCalendar{border:1px solid var(--line);border-radius:8px;padding:6px;background:#f3faf5;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.blockedDateCalendarTitle{margin:0 0 6px;font-size:11px;font-weight:700;color:var(--ink);text-align:center}
.blockedDateCalendar .holidayWeekdays,.blockedDateCalendar .holidayGrid{gap:5px}
.blockedDateCalendar .holidayWeekdays span{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:11px}
.blockedDateCalendar .holidayDay{min-height:28px;font-size:11px;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.blockedDateCalendar .holidayDay.holidayMarked{background:#f5c542;border-color:#f5c542;color:#4a3200;font-weight:700}
.blockedDateCalendar .holidayDay.weekendMarked{font-weight:700}
.blockedDateCalendar .holidayDay.active.holidayMarked{background:#22a05a;border-color:#22a05a;color:#fff}
.multiPicker{display:flex;flex-direction:column;gap:10px}
.multiSummary{min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;font-size:13px;line-height:1.5;color:var(--ink)}
.multiPanel{border:1px solid var(--line);border-radius:8px;padding:12px;background:#f3faf5}
.multiOptions{display:grid;gap:8px}
.multiOption{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.multiOption input{width:auto}
.peopleEditor{display:flex;flex-direction:column;gap:8px}
.peopleList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.personCard{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#f5fbf7}
.personHead{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.personHead strong{font-size:13px;line-height:1.2}
.personGroupTag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;background:#e8f5ec;color:var(--muted);font-size:10px;font-weight:700}
.personBlock{display:flex;flex-direction:column;gap:4px;margin-top:4px;margin-left:12px}
.personSummary{min-height:30px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff;font-size:12px;line-height:1.35}
.personPanel{border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff}
.personPanelRow{display:grid;grid-template-columns:1fr;gap:8px;align-items:end;margin-bottom:8px}
.personPanelRow button{height:32px;padding:0 12px;font-size:12px;margin:0}
.blockedList{display:flex;flex-direction:column;gap:6px}
.blockedItem{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:6px;background:#f5fbf7}
.specialText{min-height:80px;max-height:80px}
.personToggle{display:flex;align-items:flex-start;gap:6px;color:var(--ink);font-size:12px;line-height:1.35}
.personToggle input{width:auto}
.ruleBox{border:1px solid var(--line);border-radius:8px;padding:14px;background:#f5fbf7}
.ruleBox h3{font-size:16px;margin-bottom:8px}
.ruleCheck{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink)}
.ruleCheck input{width:auto}
@media(max-width:1200px){.peopleList{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1000px){.grid,.personPanelRow,.peopleList{grid-template-columns:1fr}}
</style>

function pad(n){ return String(n).padStart(2, "0"); }
function iso(y, m, d){ return `${y}-${pad(m)}-${pad(d)}`; }
function daysInMonth(month){
  const [y, m] = month.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}
function isDateInCurrentMonth(date){
  const month = $("month").value;
  return Boolean(month && String(date || "").startsWith(`${month}-`));
}
function dow(date){ return new Date(date + "T00:00:00").getDay(); }
function weekName(date){ return "\u65e5\u4e00\u4e8c\u4e09\u56db\u4e94\u516d"[dow(date)]; }
function isWeekend(date){ return dow(date) === 0 || dow(date) === 6; }
function isWeekday(date){ return !isWeekend(date); }
function isMonWed(date){ return [1,2,3].includes(dow(date)); }
function isKeyDisplayDay(date){ return [0,1,6].includes(dow(date)); }
function splitDates(v){
  return new Set(String(v || "").split(/[|,\uff0c\u3001\s]+/).map(x=>x.trim()).filter(Boolean));
}
function sortDateValues(values){
  return [...values].sort((a, b)=>a.localeCompare(b, "zh-Hans-CN"));
}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function cloneHolidayRuleSet(rules){
  return {
    holidays: [...(rules?.holidays || [])],
    makeupWorkdays: [...(rules?.makeupWorkdays || [])]
  };
}
function getHolidayRuleYear(month){
  return String(month || "").slice(0, 4);
}
function getLocalHolidayRuleSet(year){
  return cloneHolidayRuleSet(LOCAL_HOLIDAY_RULES[year]);
}
function normalizeHolidayRulePayload(payload){
  return cloneHolidayRuleSet(payload?.rules || payload);
}
function getHolidayRuleApiUrls(month){
  const query = `month=${encodeURIComponent(month || "")}`;
  const urls = [];
  if(/^https?:$/.test(window.location.protocol)){
    urls.push(new URL(`/api/holiday-rules?${query}`, window.location.href).toString());
  }
  urls.push(`${REMOTE_HOLIDAY_RULE_SITE}/api/holiday-rules?${query}`);
  return [...new Set(urls)];
}
async function loadHolidayRulesForMonth(month, options = {}){
  const year = getHolidayRuleYear(month);
  if(!year) return cloneHolidayRuleSet();
  if(!options.force && holidayRuleCache.has(year)){
    return cloneHolidayRuleSet(holidayRuleCache.get(year));
  }
  const fallbackRules = getLocalHolidayRuleSet(year);
  for(const url of getHolidayRuleApiUrls(month)){
    try{
      const response = await fetch(url, {
        headers: { "Accept": "application/json" },
        cache: "no-store"
      });
      if(!response.ok) continue;
      const payload = await response.json();
      const rules = normalizeHolidayRulePayload(payload);
      if(rules.holidays.length || rules.makeupWorkdays.length){
        holidayRuleCache.set(year, rules);
        return cloneHolidayRuleSet(rules);
      }
    }catch(error){
      console.warn("holiday-rules fetch failed", url, error);
    }
  }
  holidayRuleCache.set(year, fallbackRules);
  return cloneHolidayRuleSet(fallbackRules);
}
function getCachedHolidayRulesForMonth(month){
  const year = getHolidayRuleYear(month);
  if(!year) return cloneHolidayRuleSet();
  return cloneHolidayRuleSet(holidayRuleCache.get(year) || LOCAL_HOLIDAY_RULES[year]);
}
function getOfficialHolidayDatesForMonth(month){
  const rules = getCachedHolidayRulesForMonth(month);
  return new Set(
    rules.holidays.filter(date=>String(date).startsWith(`${month}-`))
  );
}
function getOfficialMakeupWorkDatesForMonth(month){
  const rules = getCachedHolidayRulesForMonth(month);
  return new Set(
    rules.makeupWorkdays.filter(date=>String(date).startsWith(`${month}-`))
  );
}
function calculateDefaultTargets(month, holidays){
  if(!month) return { work:0, rest:0 };
  const [y, m] = month.split("-").map(Number);
  if(!y || !m) return { work:0, rest:0 };
  const dim = daysInMonth(month);
  const makeupWorkdays = getOfficialMakeupWorkDatesForMonth(month);
  let work = 0;
  for(let day = 1; day <= dim; day++){
    const date = iso(y, m, day);
    const isOfficialHoliday = holidays.has(date);
    const isOfficialMakeupWorkday = makeupWorkdays.has(date);
    if(isOfficialMakeupWorkday || (isWeekday(date) && !isOfficialHoliday)) work++;
  }
  return { work, rest: dim - work };
}
function refreshDefaultTargets(){
  const month = $("month").value;
  const holidays = splitDates($("holidays").value);
  const targets = calculateDefaultTargets(month, holidays);
  $("targetWork").value = targets.work;
  $("targetRest").value = targets.rest;
  renderGroupEditors();
}

function renderHolidayCalendar(){
  const month = $("month").value;
  const mountPoint = $("holidayCalendar");
  if(!month){
    mountPoint.innerHTML = '<p class="small">\u8bf7\u5148\u9009\u62e9\u6392\u73ed\u6708\u4efd\uff0c\u518d\u70b9\u9009\u6cd5\u5b9a\u8282\u5047\u65e5\u3002</p>';
    return;
  }

  const [y, m] = month.split("-").map(Number);
  const totalDays = daysInMonth(month);
  const firstDow = dow(iso(y, m, 1));
  const weekdayNames = ["\u65e5","\u4e00","\u4e8c","\u4e09","\u56db","\u4e94","\u516d"];

  let cells = "";
  for(let i = 0; i < firstDow; i++) cells += '<button type="button" class="holidayDay muted" disabled></button>';
  for(let day = 1; day <= totalDays; day++){
    const date = iso(y, m, day);
    const active = pendingHolidaySelection.has(date) ? " active" : "";
    cells += `<button type="button" class="holidayDay${active}" data-date="${date}" title="${date}">${day}</button>`;
  }

  mountPoint.innerHTML = `
    <div class="holidayWeekdays">${weekdayNames.map(name=>`<span>${name}</span>`).join("")}</div>
    <div class="holidayGrid">${cells}</div>
    <p class="small">\u70b9\u51fb\u65e5\u671f\u5373\u53ef\u6dfb\u52a0\u6216\u53d6\u6d88\u6cd5\u5b9a\u8282\u5047\u65e5\uff0c\u5df2\u9009 ${pendingHolidaySelection.size} \u5929\u3002</p>
    <div class="holidayActions">
      <button type="button" id="holidayConfirm">\u786e\u5b9a</button>
      <button type="button" id="holidayCancel" class="secondary">\u53d6\u6d88</button>
    </div>
  `;

  mountPoint.querySelectorAll("[data-date]").forEach(btn=>{
    btn.addEventListener("click", ()=>toggleHolidayDate(btn.dataset.date));
  });
  $("holidayConfirm").addEventListener("click", confirmHolidaySelection);
  $("holidayCancel").addEventListener("click", cancelHolidaySelection);
}

function cloneBlockedRules(rules){
  return (rules || []).map(rule=>({ date:rule.date, mode:rule.mode }));
}
function parseBlockedRuleString(value){
  return String(value || "").split("|").map(x=>x.trim()).filter(Boolean).map(item=>{
    const [date, mode] = item.split("@");
    return date && mode ? { date, mode } : null;
  }).filter(Boolean);
}
function serializeBlockedRules(rules){
  return (rules || []).map(rule=>`${rule.date}@${rule.mode}`).join("|");
}
function expandDayRange(start, end){
  const month = $("month").value;
  if(!month) return [];
  const [y, m] = month.split("-").map(Number);
  const maxDay = daysInMonth(month);
  const from = Math.max(1, Math.min(start, end));
  const to = Math.min(maxDay, Math.max(start, end));
  const dates = [];
  for(let day = from; day <= to; day++) dates.push(iso(y, m, day));
  return dates;
}
function leaveModeLabel(mode){
  return LEAVE_MODE_OPTIONS.find(option=>option.value === mode)?.label || mode;
}
function formatBlockedRulesSummary(rules){
  if(!rules?.length) return TEXT.noBlockedDates;
  return rules.map(rule=>`${rule.date} ${leaveModeLabel(rule.mode)}`).join("\uff1b");
}

function renderBlockedDateCalendar(groupKey, index){
  const person = getPersonEditor(groupKey, index);
  const month = $("month").value;
  if(!person) return "";
  if(!month) return `<p class="small">请先选择排班月份，再设置不可排班日期。</p>`;
  const [y, m] = month.split("-").map(Number);
  const totalDays = daysInMonth(month);
  const firstDow = dow(iso(y, m, 1));
  const weekdayNames = ["日","一","二","三","四","五","六"];
  const holidayDates = getOfficialHolidayDatesForMonth(month);
  let cells = "";
  for(let i = 0; i < firstDow; i++) cells += '<button type="button" class="holidayDay muted" disabled></button>';
  for(let day = 1; day <= totalDays; day++){
    const date = iso(y, m, day);
    const classes = ["holidayDay"];
    if(person.blockedDraftDates?.includes(date)) classes.push("active");
    if(holidayDates.has(date)) classes.push("holidayMarked");
    if(isWeekend(date)) classes.push("weekendMarked");
    cells += `<button type="button" class="${classes.join(" ")}" data-action="select-blocked-date" data-group="${groupKey}" data-index="${index}" data-date="${date}" title="${date}">${day}</button>`;
  }
  return `
    <div class="blockedDateCalendar">
      <p class="blockedDateCalendarTitle">${y}年${m}月</p>
      <div class="holidayWeekdays">${weekdayNames.map(name=>`<span>${name}</span>`).join("")}</div>
      <div class="holidayGrid">${cells}</div>
      <p class="small">可连续选择多个日期，黄色为法定节假日。</p>
    </div>
  `;
}

        ${LEAVE_MODE_OPTIONS.map(option=>`<option value="${option.value}" ${option.value===rule.mode ? "selected" : ""}>${option.label}</option>`).join("")}
      </select>

function validateEditorData(){
  const issues = [];
  for(const groupKey of Object.keys(groupEditors)){
    for(const person of groupEditors[groupKey]){
      const seen = new Set();
      for(const rule of person.blockedRules){
        if(!rule.date || !isDateInCurrentMonth(rule.date)){
          issues.push(`${person.name} \u4e0d\u53ef\u6392\u73ed\u65e5\u671f\u4e0d\u5728\u5f53\u524d\u6392\u73ed\u6708\u4efd\u5185`);
          continue;
        }
        if(seen.has(rule.date)) issues.push(`${person.name} \u540c\u4e00\u5929\u53ea\u80fd\u4fdd\u7559\u4e00\u6761\u4e0d\u53ef\u6392\u73ed\u89c4\u5219`);
        seen.add(rule.date);
      }
    }
  }
  return [...new Set(issues)];
}

  if(mode === "custom_rest") return isWorkShift(shift);
  if(mode === "morning_normal_only") return shift === SHIFT_NORMAL;
  if(mode === "normal_only") return shift === SHIFT_NORMAL;
  if(mode === "mid1_only") return shift === SHIFT_MID1;

function bindGroupEditorEvents(groupKey, containerId){
  $(containerId).addEventListener("click", event=>{
    const action = event.target.dataset.action;
    if(!action) return;
    const group = event.target.dataset.group;
    const index = Number(event.target.dataset.index);
    const person = getPersonEditor(group, index);
    if(!person) return;

    if(action === "toggle-blocked-panel"){
      person.blockedPanelOpen = !person.blockedPanelOpen;
      person.blockedDraft = cloneBlockedRules(person.blockedRules);
      person.blockedDraftDates = [];
      person.blockedDateCalendarOpen = false;
      renderGroupEditors();
      return;
    }
    if(action === "toggle-blocked-date-calendar"){
      person.blockedDateCalendarOpen = !person.blockedDateCalendarOpen;
      renderGroupEditors();
      return;
    }
    if(action === "select-blocked-date"){
      const dateValue = event.target.dataset.date || "";
      const selectedDates = new Set(person.blockedDraftDates || []);
      if(selectedDates.has(dateValue)) selectedDates.delete(dateValue);
      else selectedDates.add(dateValue);
      person.blockedDraftDates = sortBlockedDraftDates([...selectedDates]);
      renderGroupEditors();
      return;
    }
    if(action === "add-blocked-rule"){
      const dateValues = sortBlockedDraftDates(person.blockedDraftDates);
      const modeValue = $(`${group}-${index}-blocked-mode`)?.value || "all";
      if(!dateValues.length) return alert(TEXT.needDate);
      if(!$("month").value) return alert(TEXT.needMonth);
      if(dateValues.some(dateValue=>!isDateInCurrentMonth(dateValue))) return alert(TEXT.invalidBlockMonth);
      dateValues.forEach(dateValue=>{
        const existing = person.blockedDraft.find(rule=>rule.date === dateValue);
        if(existing) existing.mode = modeValue;
        else person.blockedDraft.push({ date:dateValue, mode:modeValue });
      });
      person.blockedDraft.sort((a, b)=>a.date.localeCompare(b.date));
      person.blockedPanelOpen = true;
      person.blockedDraftDates = [];
      person.blockedDateCalendarOpen = false;
      renderGroupEditors();
      return;
    }
    if(action === "remove-blocked-rule"){
      const ruleIndex = Number(event.target.dataset.ruleIndex);
      person.blockedDraft.splice(ruleIndex, 1);
      person.blockedPanelOpen = true;
      renderGroupEditors();
      return;
    }
    if(action === "confirm-blocked-rules"){
      person.blockedRules = cloneBlockedRules(person.blockedDraft);
      person.blockedPanelOpen = false;
      person.blockedDraftDates = [];
      person.blockedDateCalendarOpen = false;
      syncAllGroupTextareas();
      refreshFixedRuleOptions();
      renderGroupEditors();
      return;
    }
    if(action === "cancel-blocked-rules"){
      person.blockedDraft = cloneBlockedRules(person.blockedRules);
      person.blockedPanelOpen = false;
      person.blockedDraftDates = [];
      person.blockedDateCalendarOpen = false;
      renderGroupEditors();
      return;
    }
  });
  $(containerId).addEventListener("change", event=>{
    if(event.target.dataset.action === "toggle-backup"){
      const group = event.target.dataset.group;
      const index = Number(event.target.dataset.index);
      const person = getPersonEditor(group, index);
      if(!person) return;
      person.isBackup = normalizeBackupFlag(person.name, Boolean(event.target.checked));
      syncAllGroupTextareas();
      renderGroupEditors();
      return;
    }
    if(event.target.dataset.action !== "change-blocked-mode") return;
    const group = event.target.dataset.group;
    const index = Number(event.target.dataset.index);
    const ruleIndex = Number(event.target.dataset.ruleIndex);
    const person = getPersonEditor(group, index);
    if(!person?.blockedDraft[ruleIndex]) return;
    person.blockedDraft[ruleIndex].mode = event.target.value;
  });
}

      commonForm: snapshot.commonForm || snapshot.form || null,

  if(match) return dateLookup.md.get(`${Number(match[1])}月${Number(match[2])}日`) || "";
  match = normalized.match(/^(\d{1,2})[/-](\d{1,2})$/);
  if(match) return dateLookup.slash.get(`${Number(match[1])}/${Number(match[2])}`) || dateLookup.slash.get(`${Number(match[1])}-${Number(match[2])}`) || "";

    .filter(item=>item.match?.person);

function normalizePrevScheduleCell(value){

  if(raw === "正" || raw.includes(SHIFT_NORMAL)) return { normalized:SHIFT_NORMAL, display:raw === "正" ? SHIFT_NORMAL : raw };
  if(raw === "中1" || raw === "中一" || raw.includes(SHIFT_MID1)) return { normalized:SHIFT_MID1, display:raw === "中1" || raw === "中一" ? SHIFT_MID1 : raw };
  if(raw === "中2" || raw === "中二" || raw.includes(SHIFT_MID2)) return { normalized:SHIFT_MID2, display:raw === "中2" || raw === "中二" ? SHIFT_MID2 : raw };
  if(raw === "休" || raw.includes(SHIFT_REST)) return { normalized:SHIFT_REST, display:raw === "休" ? SHIFT_REST : SHIFT_REST };

function recalculatePrevMonthCarry(person){

    const value = info.normalized;

      if(carryRest > 0) break;
      carryWork++;
      continue;
    }
    if(value === SHIFT_REST){
      if(carryWork > 0) break;
      carryRest++;

    }

  }

function parsePrevSchedule(allPeople){

  let dayColumnMap = null;
  for(const cells of rows){
    const candidate = {};
    cells.forEach((cell, index)=>{
      const match = String(cell || "").trim().match(/(\d{1,2})\s*(?:日|号)/);
      if(match) candidate[index] = Number(match[1]);
    });
    if(Object.keys(candidate).length >= 7){
      dayColumnMap = candidate;
      break;
    }
  }
  for(const cells of rows){
    const person = allPeople.find(p=>cells.includes(p.name));
    if(!person) continue;
    const dayMap = {};
    if(dayColumnMap){
      Object.entries(dayColumnMap).forEach(([index, day])=>{
        dayMap[day] = normalizePrevScheduleCell(cells[Number(index)]);
      });
    }else{
      const idx = cells.indexOf(person.name);
      const dayCells = cells.slice(idx + 1).filter(c =>
        [SHIFT_NORMAL, SHIFT_MID1, SHIFT_MID2, SHIFT_REST, "", SHIFT_LEAVE_MANUAL].includes(c) || c === "\u7a7a\u767d" || c.includes("(假)")

function getLeadingPrevDates(month, count = 7){

  const dates = [];

    const d = new Date(firstDate);
    d.setDate(d.getDate() - offset);
    dates.push(iso(d.getFullYear(), d.getMonth() + 1, d.getDate()));
  }
  return dates;

      const bw = attendanceCount(b, dates) / Math.max(1, b.targetWork);

function generate(regenerateMode = "initial"){

      else{
        const replacement = pickLeastWorked(ecomDuty, d, SHIFT_NORMAL, dates, ["Amber"]);
        if(replacement) assign(replacement, d, SHIFT_NORMAL, "\u7535\u5546\u5468\u672b\u56fa\u5b9a\u503c\u73ed\u51b2\u7a81\uff0c\u5df2\u4e34\u65f6\u66ff\u6362");
      }
      for(const [shift, p] of Object.entries(techWeekend)){
        if(p && canAssign(p, d, shift, dates)) assign(p, d, shift);
        else{

      if(amber && canAssign(amber, d, SHIFT_NORMAL, dates)) assign(amber, d, SHIFT_NORMAL);
      else if(amber) amber.notes.push(`${d} Amber \u5de5\u4f5c\u65e5\u56fa\u5b9a\u6b63\u73ed\u672a\u80fd\u5b89\u6392`);

      const m2 = pickLeastWorked(techDuty, d, SHIFT_MID2, dates, ["John","Arya",m1?.name]);

  applyCustomRestDays(all, dates, holidays);

  });

}

let previewImageBlob = null;
function triggerDownload(url, fileName){
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function ensureImageExportLibrary(){
  if(window.htmlToImage?.toBlob) return window.htmlToImage;
  await new Promise((resolve, reject)=>{
    const existing = document.querySelector("script[data-role='html-to-image']");
    if(existing){
      existing.addEventListener("load", resolve, {once:true});
      existing.addEventListener("error", reject, {once:true});
      return;
    }
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js";
    script.async = true;
    script.dataset.role = "html-to-image";
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
  if(!window.htmlToImage?.toBlob) throw new Error("图片导出库加载失败");
  return window.htmlToImage;
}
function buildMonthlyExportNode(r){

  wrapper.style.maxWidth = "none";
  wrapper.style.overflow = "visible";
  wrapper.style.background = "#fff";
  wrapper.style.padding = "16px";
  wrapper.style.zIndex = "-1";
  wrapper.innerHTML = `<style>${getExportStyles()}</style>${buildMonthlyExportContentHtml(r)}`;
  document.body.appendChild(wrapper);
  return wrapper;
}
async function savePreviewImage(){
  if(!previewImageBlob || !latest) return alert("请先生成月度排班图片");
  const fileName = `${latest.month}\u5ba2\u670d\u6392\u73ed-\u6708\u5ea6\u6392\u73ed\u8868.png`;
  if(typeof window.showSaveFilePicker === "function"){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: "PNG 图片", accept: { "image/png": [".png"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(previewImageBlob);
      await writable.close();
      alert("PNG 已保存");
      return;
    }catch(error){
      if(error?.name === "AbortError") return;
    }
  }
  const pngUrl = URL.createObjectURL(previewImageBlob);
  triggerDownload(pngUrl, fileName);
  setTimeout(()=>URL.revokeObjectURL(pngUrl), 1000);
  alert("PNG 已开始保存。如果浏览器拦截了下载，请允许当前页面下载文件。");
}

async function downloadScheduleImage(){
  if(!latest) return alert(TEXT.pleaseGenerate);

    const exportNode = buildMonthlyExportNode(latest);
    const pngBlob = await htmlToImage.toBlob(exportNode, {
      pixelRatio: 2,
      backgroundColor: "#ffffff",
      cacheBust: true
    });

    if(!pngBlob) return alert("图片生成失败，请重试");
    setImageExportState(pngBlob);
    alert("月度排班图片已生成，可以点击“保存 PNG”");
  }catch(error){
    const exportNode = document.querySelector("body > div[style*='z-index: -1'], body > div[style*='z-index:-1']");
    if(exportNode?.parentNode) exportNode.parentNode.removeChild(exportNode);
    console.error(error);
    alert("图片生成失败，请检查网络后重试");
  }
}
